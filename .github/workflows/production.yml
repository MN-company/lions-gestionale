name: Redazione LION production
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: redazione-lion-production
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_tlVkdTknVZ34Ty7nah0lkj8w
      VERCEL_PROJECT_ID: prj_wHv8T4TDErprNkYttlQPQiLKwq9V
      SUPABASE_PROJECT_REF: mtwzdrmhkehcvkgybfag
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Check production credentials
        run: |
          for secret in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD VERCEL_TOKEN; do
            if [ -z "${!secret}" ]; then
              printf '::error::Missing GitHub Actions secret %s\n' "$secret"
              exit 1
            fi
          done
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Build web application
        run: |
          npx --yes vercel@48.0.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@48.0.0 build --prod --token="$VERCEL_TOKEN"
      - name: Apply Supabase migrations
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push --yes
      - name: Deploy Vercel production
        run: npx --yes vercel@48.0.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
